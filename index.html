<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaForge - AI Manga Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 2.2rem; }
        p { color: #8b949e; margin-bottom: 25px; }
        textarea { width: 100%; height: 100px; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 1rem; resize: none; margin-bottom: 15px; }
        textarea:focus { outline: 1px solid #58a6ff; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2ea043; }
        .download-btn { display: none; margin-top: 15px; background: #1f6feb; }
        .download-btn:hover { background: #388bfd; }
        .result-box { margin-top: 25px; min-height: 250px; display: flex; align-items: center; justify-content: center; border: 2px dashed #30363d; border-radius: 8px; overflow: hidden; background: #0d1117; flex-direction: column; padding: 10px; }
        img { max-width: 100%; height: auto; display: none; border-radius: 6px; }
        .loading { display: none; color: #58a6ff; font-weight: bold; }
        .error { display: none; color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 MangaForge AI</h1>
        <p>আপনার মনমতো মঙ্গা ও এনিমে আর্ট জেনারেট করুন!</p>
        
        <textarea id="prompt" placeholder="উদাহরণ: A cool anime boy with silver hair, action pose, black hoodie, manga style..."></textarea>
        <button id="genBtn" onclick="generateImage()">Manga Image জেনারেট করুন</button>

        <div class="result-box">
            <span id="placeholder">আপনার জেনারেট করা ছবি এখানে দেখাবে</span>
            <span id="loading" class="loading">ছবি তৈরি হচ্ছে, একটু অপেক্ষা করুন...</span>
            <span id="errorMsg" class="error">ছবি লোড হতে সমস্যা হয়েছে, আবার চেষ্টা করুন!</span>
            <img id="mangaImage" alt="Generated Manga Art">
        </div>

        <a id="downloadLink" href="#" target="_blank" download="manga_art.png" style="text-decoration: none;">
            <button id="downloadBtn" class="download-btn">ছবি ডাউনলোড করুন</button>
        </a>
    </div>

    <script>
        function generateImage() {
            const promptInput = document.getElementById('prompt');
            const promptText = promptInput.value.trim();
            const imgElement = document.getElementById('mangaImage');
            const loadingText = document.getElementById('loading');
            const placeholderText = document.getElementById('placeholder');
            const errorMsg = document.getElementById('errorMsg');
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadLink = document.getElementById('downloadLink');
            const genBtn = document.getElementById('genBtn');

            if (!promptText) {
                alert("দয়া করে একটি প্রম্পট লিখুন!");
                return;
            }

            imgElement.style.display = 'none';
            placeholderText.style.display = 'none';
            errorMsg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loadingText.style.display = 'block';
            genBtn.disabled = true;
            genBtn.innerText = "জেনারেট হচ্ছে...";

            const fullPrompt = encodeURIComponent(promptText + ", high quality manga art style, anime aesthetic, detailed, highly dynamic");
            const randomSeed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=512&height=512&nologo=true&seed=${randomSeed}`;

            imgElement.src = imageUrl;

            imgElement.onload = () => {
                loadingText.style.display = 'none';
                imgElement.style.display = 'block';
                downloadBtn.style.display = 'block';
                downloadLink.href = imageUrl;
                genBtn.disabled = false;
                genBtn.innerText = "Manga Image জেনারেট করুন";
            };

            imgElement.onerror = () => {
                loadingText.style.display = 'none';
                errorMsg.style.display = 'block';
                genBtn.disabled = false;
                genBtn.innerText = "Manga Image জেনারেট করুন";
            };
        }
    </script>
</body>
</html>

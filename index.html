<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangaForge - Dedicated Ultra-HD Image Studio Engine</title>
    <style>
        /* CSS Reset & Global Layout Rules */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: linear-gradient(135deg, #090d16, #111827, #1e1035); 
            color: #f8fafc; 
            text-align: center; 
            padding: 20px; 
            min-height: 100vh;
        }

        /* Authentication System Styles */
        #authOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(5, 9, 20, 0.94); backdrop-filter: blur(15px); 
            display: flex; align-items: center; justify-content: center; z-index: 10000; 
        }
        .auth-card { 
            background: #111827; padding: 40px; border-radius: 20px; 
            border: 1px solid #1f2937; width: 90%; max-width: 440px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
        }
        .auth-card h2 { color: #38bdf8; margin-bottom: 12px; font-size: 2rem; }
        .auth-card p { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
        .auth-card input { 
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #374151; 
            background: #0b0f19; color: #fff; margin-bottom: 20px; outline: none; font-size: 1rem; 
        }
        .auth-card input:focus { border-color: #38bdf8; }

        /* Main Workspace Container */
        .container { 
            max-width: 1100px; margin: 20px auto; 
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); 
            padding: 35px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: none; 
        }

        /* Navigation Header & User Bar */
        .user-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1f2937; padding: 14px 24px; border-radius: 14px; 
            margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .user-bar span { color: #38bdf8; font-weight: 700; font-size: 1.05rem; }
        .logout-btn { 
            background: #ef4444; padding: 8px 18px; font-size: 0.9rem; 
            border-radius: 8px; cursor: pointer; border: none; color: #fff; font-weight: bold; transition: 0.3s; 
        }
        .logout-btn:hover { background: #dc2626; transform: translateY(-1px); }

        /* Control Tab Navigation */
        .mode-tabs { display: flex; gap: 12px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { 
            flex: 1; min-width: 140px; padding: 14px 20px; background: #1f2937; 
            border: 1px solid #374151; color: #94a3b8; border-radius: 12px; 
            cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.95rem; 
        }
        .tab-btn:hover { color: #fff; background: #374151; }
        .tab-btn.active { 
            background: #0284c7; color: white; border-color: #38bdf8; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35); 
        }
        .gemini-tab.active { 
            background: linear-gradient(135deg, #a855f7, #6366f1) !important; 
            border-color: #c084fc !important; box-shadow: 0 0 20px rgba(192, 132, 252, 0.4) !important; 
        }

        /* Branding Typography */
        h1 { color: #38bdf8; margin-bottom: 8px; font-size: 2.6rem; letter-spacing: -0.5px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 1.05rem; }

        /* Image Control Form Architecture */
        .form-section { 
            background: #0b0f19; padding: 30px; border-radius: 18px; 
            border: 1px solid #1f2937; margin-bottom: 30px; text-align: left; 
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
        
        input[type="text"], textarea, select, input[type="number"] { 
            width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #374151; 
            background: #111827; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s; 
        }
        textarea { height: 110px; resize: vertical; }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }

        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }

        /* Engine Action Buttons */
        .submit-btn { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white; border: none; border-radius: 12px; font-size: 1.15rem; font-weight: bold; 
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4); margin-top: 10px; 
        }
        .submit-btn:hover { background: linear-gradient(135deg, #0369a1, #1d4ed8); transform: translateY(-2px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .gemini-btn { 
            background: linear-gradient(135deg, #8b5cf6, #d946ef) !important; 
            box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4) !important; 
        }
        .gemini-btn:hover { background: linear-gradient(135deg, #7c3aed, #c084fc) !important; }

        /* Saved Projects View Grid */
        .project-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; text-align: left; }
        .project-card { 
            background: #111827; padding: 20px; border-radius: 14px; 
            border: 1px solid #374151; transition: 0.3s; 
        }
        .project-card:hover { border-color: #38bdf8; transform: translateY(-3px); }

        /* Output Gallery Grid System */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 35px; }
        .card { 
            background: #070a12; padding: 16px; border-radius: 16px; 
            border: 1px solid #1f2937; display: flex; flex-direction: column; 
            align-items: center; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .card img { 
            width: 100%; height: auto; border-radius: 12px; display: block; 
            box-shadow: 0 6px 16px rgba(0,0,0,0.6); cursor: pointer; transition: filter 0.2s ease, transform 0.2s ease; 
        }
        .card img:hover { transform: scale(1.01); }
        
        .page-badge { 
            position: absolute; top: 25px; left: 25px; background: rgba(0,0,0,0.85); 
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; 
            color: #38bdf8; border: 1px solid #38bdf8; backdrop-filter: blur(4px); 
        }

        /* Post-Processing Filters Control Interface */
        .image-controls { 
            width: 100%; background: #111827; margin-top: 15px; padding: 12px; 
            border-radius: 10px; border: 1px solid #1f2937; text-align: left; 
        }
        .image-controls label { font-size: 0.75rem; color: #94a3b8; display: block; margin-top: 6px; }
        .image-controls input[type="range"] { width: 100%; margin-top: 2px; cursor: pointer; }

        .btn-row { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
        .action-btn { 
            flex: 1; padding: 10px; font-size: 0.9rem; border-radius: 8px; 
            text-decoration: none; color: white; display: inline-block; 
            text-align: center; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; 
        }
        .download-btn { background: linear-gradient(135deg, #ec4899, #d946ef); }
        .download-btn:hover { background: linear-gradient(135deg, #db2777, #c084fc); }
        .newtab-btn { background: linear-gradient(135deg, #10b981, #059669); }
        .newtab-btn:hover { background: linear-gradient(135deg, #059669, #047857); }

        .status-msg { margin-top: 30px; font-weight: bold; color: #38bdf8; font-size: 1.15rem; }

        /* Lightbox Image Preview Modal */
        #lightbox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; align-items: center; 
            justify-content: center; z-index: 20000; padding: 20px; 
        }
        #lightbox img { max-width: 90%; max-height: 90vh; border-radius: 12px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>

    <!-- Authentication Modal Overlay -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>MangaForge Engine</h2>
            <p>Enter your session username to unlock the dedicated image workspace:</p>
            <input type="text" id="usernameInput" placeholder="Your Username...">
            <button class="submit-btn" onclick="handleSignIn()">Sign In & Initialize</button>
        </div>
    </div>

    <!-- Main Engine Container -->
    <div class="container" id="appContainer">
        <div class="user-bar">
            <span>👤 Active Creator: <span id="displayUser"></span></span>
            <button class="logout-btn" onclick="handleSignOut()">Sign Out Session</button>
        </div>

        <h1>🎨 Dedicated Image Studio Engine</h1>
        <p class="subtitle">Next-Gen High Definition AI Manga & Artwork Rendering Pipeline</p>

        <!-- Navigation Tabs -->
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="switchTab('new')">✨ New Project</button>
            <button class="tab-btn gemini-tab" onclick="switchTab('gemini')">✨ Gemini AI Mode</button>
            <button class="tab-btn" onclick="switchTab('continue')">📖 Continue Story</button>
            <button class="tab-btn" onclick="switchTab('saved')">📁 Saved Projects</button>
        </div>
        
        <!-- Main Form Input Section -->
        <div class="form-section" id="formSection">
            <div class="form-group">
                <label for="projectName">Project Title</label>
                <input type="text" id="projectName" placeholder="e.g. Dark Knight Chronicles 8K">
            </div>

            <div class="form-group" id="selectProjectGroup" style="display: none;">
                <label for="existingProjects">Select Saved Project to Continue</label>
                <select id="existingProjects" onchange="onProjectSelect()"></select>
            </div>

            <div class="form-group">
                <label for="prompt">Scene Prompt & Visual Details</label>
                <textarea id="prompt" placeholder="Example: The Dark Knight standing on skyscraper gargoyle, dramatic heavy rain, cinematic dark shadows, 8k resolution octane render..."></textarea>
            </div>
            
            <div class="options-grid">
                <div class="form-group">
                    <label for="mangaStyle">Artistic Preset Theme</label>
                    <select id="mangaStyle">
                        <option value="dark">Dark Fantasy / Seinen (Cinematic)</option>
                        <option value="classic">Classic Shonen Manga</option>
                        <option value="anime">Modern Anime Visual</option>
                        <option value="cyberpunk">Cyberpunk / Neon Sci-Fi</option>
                        <option value="photorealistic">Hyper Realistic Artwork</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resolutionPreset">Dedicated Image Quality & Dimension</label>
                    <select id="resolutionPreset">
                        <option value="1024x1536">1024 x 1536 (Standard Ultra-HD)</option>
                        <option value="1440x2160">1440 x 2160 (2K Master Quality)</option>
                        <option value="2160x3840">2160 x 3840 (4K Extreme Detail)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colorMode">Coloring Engine</label>
                    <select id="colorMode">
                        <option value="color">Full Color (Cinematic Color Grade)</option>
                        <option value="bw">Black & White (Traditional Ink)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pageCount">Pages/Batch Count (Max 30)</label>
                    <input type="number" id="pageCount" min="1" max="30" value="1">
                </div>
            </div>

            <button id="genBtn" class="submit-btn" onclick="generateManga()">Generate High Quality Artwork</button>
        </div>

        <!-- Saved Projects Grid View -->
        <div id="savedSection" style="display: none;" class="form-section">
            <h3 style="margin-bottom: 20px; color: #38bdf8;">Saved Projects Library</h3>
            <div id="projectList" class="project-list"></div>
        </div>

        <!-- Engine Status Notification -->
        <div id="statusMsg" class="status-msg"></div>

        <!-- Main Gallery Pipeline Output -->
        <div id="gallery" class="gallery"></div>
    </div>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Full Resolution Preview">
    </div>

    <script>
        // Internal Application State Architecture
        let currentMode = 'new';
        let projectsData = JSON.parse(localStorage.getItem('mangaForgeDedicatedProjects') || '{}');

        // Initialization Routine
        window.onload = function() {
            const savedUser = localStorage.getItem('mangaForgeUser');
            if (savedUser) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                document.getElementById('displayUser').innerText = savedUser;
                populateProjectsDropdown();
            }
        };

        // User Session Management
        function handleSignIn() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) return alert("Please enter a valid session username!");
            localStorage.setItem('mangaForgeUser', name);
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('displayUser').innerText = name;
            populateProjectsDropdown();
        }

        function handleSignOut() {
            localStorage.removeItem('mangaForgeUser');
            location.reload();
        }

        // Tab Switcher Routine
        function switchTab(mode) {
            currentMode = mode;
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            document.getElementById('gallery').innerHTML = '';
            document.getElementById('statusMsg').innerText = '';

            const genBtn = document.getElementById('genBtn');

            if (mode === 'new') {
                tabs[0].classList.add('active');
                document.getElementById('formSection').style.display = 'block';
                document.getElementById('savedSection').style.display = 'none';
                document.getElementById('selectProjectGroup').style.display = 'none';
                genBtn.className = "submit-btn";
                genBtn.innerText = "Generate New Dedicated HD Project";
            } else if (mode === 'gemini') {
                tabs[1].classList.add('active');
                document.getElementById('formSection').style.display = 'block';
                document.getElementById('savedSection').style.display = 'none';
                document.getElementById('selectProjectGroup').style.display = 'none';
                genBtn.className = "submit-btn gemini-btn";
                genBtn.innerText = "✨ Generate Ultra HD via Gemini Engine";
            } else if (mode === 'continue') {
                tabs[2].classList.add('active');
                document.getElementById('formSection').style.display = 'block';
                document.getElementById('savedSection').style.display = 'none';
                document.getElementById('selectProjectGroup').style.display = 'block';
                genBtn.className = "submit-btn";
                genBtn.innerText = "Continue & Add New HD Pages";
                populateProjectsDropdown();
                onProjectSelect();
            } else if (mode === 'saved') {
                tabs[3].classList.add('active');
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('savedSection').style.display = 'block';
                renderSavedProjectsList();
            }
        }

        // Project State Helpers
        function populateProjectsDropdown() {
            const select = document.getElementById('existingProjects');
            select.innerHTML = '';
            const names = Object.keys(projectsData);
            if (names.length === 0) {
                select.innerHTML = '<option value="">No existing projects found</option>';
                return;
            }
            names.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = `${name} (${projectsData[name].pages.length} Pages)`;
                select.appendChild(opt);
            });
        }

        function onProjectSelect() {
            const name = document.getElementById('existingProjects').value;
            if (name && projectsData[name]) {
                document.getElementById('projectName').value = name;
                renderProjectGallery(name);
            }
        }

        function renderSavedProjectsList() {
            const container = document.getElementById('projectList');
            container.innerHTML = '';
            const names = Object.keys(projectsData);

            if (names.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;">No saved projects yet. Start a new project!</p>';
                return;
            }

            names.forEach(name => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <h4 style="color:#38bdf8; margin-bottom:8px; font-size:1.1rem;">${name}</h4>
                    <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:14px;">Total Pages: ${projectsData[name].pages.length}</p>
                    <button class="action-btn newtab-btn" onclick="openSavedProject('${name}')">Open Project</button>
                `;
                container.appendChild(card);
            });
        }

        function openSavedProject(name) {
            switchTab('continue');
            document.getElementById('existingProjects').value = name;
            onProjectSelect();
        }

        // Dedicated Gallery Renderer with Post-Processing Matrix Controls
        function renderProjectGallery(projectName) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            if (!projectsData[projectName]) return;

            const pages = projectsData[projectName].pages;
            pages.forEach((url, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const imgId = `img_${index}`;
                
                card.innerHTML = `
                    <span class="page-badge">Pag
